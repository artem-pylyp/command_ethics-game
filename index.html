<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Командирська етика — симулятор етичних рішень</title>
<meta name="description" content="Інтерактивний симулятор етичних рішень командира для здобувачів вищої освіти закладів системи МВС України.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060b16;
  --bg2:#0b1428;
  --panel:rgba(14,26,52,.72);
  --line:rgba(120,160,255,.16);
  --line-strong:rgba(120,160,255,.35);
  --text:#e6ecf8;
  --muted:#8b9abb;
  --blue:#3d7bff;
  --blue-soft:#7fa6ff;
  --gold:#ffc83d;
  --good:#3ddc97;
  --warn:#ffb547;
  --bad:#ff5d6c;
  --radius:14px;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --display:"Unbounded",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:400 17px/1.6 var(--sans);
  overflow-x:hidden;
}
/* ---------- Background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::before{
  content:"";position:absolute;inset:-50%;
  background:
    radial-gradient(circle at 30% 20%,rgba(61,123,255,.22),transparent 40%),
    radial-gradient(circle at 75% 80%,rgba(255,200,61,.09),transparent 40%);
  animation:drift 30s ease-in-out infinite alternate;
}
.bg .grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
  opacity:.5;
}
.bg .radar{
  position:absolute;width:900px;height:900px;right:-300px;top:-300px;border-radius:50%;
  border:1px solid var(--line);
  background:conic-gradient(from 0deg,rgba(61,123,255,.18),transparent 25%);
  animation:spin 9s linear infinite;
  mask-image:radial-gradient(circle,#000 60%,transparent 71%);
}
.bg .radar::after{content:"";position:absolute;inset:150px;border-radius:50%;border:1px solid var(--line)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translate(4%,3%) scale(1.05)}}

/* ---------- Layout ---------- */
.app{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 0 22px;border-bottom:1px solid var(--line);margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:700 15px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font:400 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.status{font:400 12px var(--mono);color:var(--muted);display:flex;gap:18px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{order:-1}}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  backdrop-filter:blur(10px);
  position:relative;
}
.panel.corners::before,.panel.corners::after{
  content:"";position:absolute;width:18px;height:18px;border:2px solid var(--gold);opacity:.8
}
.panel.corners::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--radius)}
.panel.corners::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--radius)}

/* ---------- Side HUD ---------- */
.side{padding:20px;position:sticky;top:20px}
.side h3{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.meter{margin-bottom:16px}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
.meter .row span:last-child{font:600 13px var(--mono)}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1),background .6s}
.delta{font:600 12px var(--mono);margin-left:8px;opacity:0;transition:opacity .3s}
.delta.show{opacity:1}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.progress{display:flex;gap:6px;margin:18px 0 6px}
.progress span{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.1)}
.progress span.on{background:var(--gold);box-shadow:0 0 10px rgba(255,200,61,.6)}
.side .hint{font-size:13px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.best{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font:400 12px var(--mono);color:var(--muted);display:flex;justify-content:space-between}
.best b{color:var(--gold)}

/* ---------- Main stage ---------- */
.stage{min-height:520px;padding:34px 36px 36px;overflow:hidden}
@media (max-width:600px){.stage{padding:24px 20px}}
.screen{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.kicker{font:600 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:26px;height:2px;background:var(--gold)}
.steps{display:flex;align-items:center;gap:8px;margin:-6px 0 4px;flex-wrap:wrap;font:600 12px var(--mono);color:var(--muted)}
.steps .st{display:flex;align-items:center;gap:6px}
.steps .st i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong)}
.steps .st.done i{background:rgba(61,220,151,.15);border-color:var(--good);color:var(--good)}
.steps .st.now{color:var(--text)}
.steps .st.now i{background:var(--gold);border-color:var(--gold);color:#1a1400}
.steps .sep{width:18px;height:1px;background:var(--line-strong)}
h1,h2{font-family:var(--display);line-height:1.15;margin:12px 0 18px}
h1{font-size:clamp(30px,5vw,54px);font-weight:900;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
h2{font-size:clamp(22px,3vw,32px);font-weight:700}
.lead{font-size:18px;color:#c6d2ec;max-width:62ch}

.scene-head{display:flex;gap:22px;align-items:flex-start;margin-bottom:8px}
.scene-icon{flex:none;width:86px;height:86px;border-radius:18px;border:1px solid var(--line-strong);
  background:linear-gradient(160deg,rgba(61,123,255,.25),rgba(61,123,255,.03));display:grid;place-items:center;
  box-shadow:inset 0 0 30px rgba(61,123,255,.2)}
.scene-icon svg{width:50px;height:50px}
@media (max-width:600px){.scene-icon{width:60px;height:60px}.scene-icon svg{width:34px;height:34px}}

.brief{
  border-left:3px solid var(--blue);background:rgba(61,123,255,.07);
  padding:18px 22px;border-radius:0 10px 10px 0;margin:18px 0 26px;font-size:17.5px;min-height:5em;
}
.brief .caret{display:inline-block;width:.55em;height:1.1em;background:var(--gold);vertical-align:-2px;animation:blink 1s infinite;margin-left:2px}
.skip{font:400 12px var(--mono);color:var(--muted);background:none;border:0;cursor:pointer;padding:0;margin:-14px 0 18px;text-decoration:underline dotted}

.choices{display:grid;gap:12px}
.choice{
  all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;
  padding:16px 18px;border-radius:12px;border:1px solid var(--line-strong);
  background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;
  opacity:0;animation:enter .5s cubic-bezier(.2,.8,.2,1) forwards;
}
.choice:hover,.choice:focus-visible{transform:translateX(6px);border-color:var(--gold);
  background:linear-gradient(90deg,rgba(255,200,61,.1),rgba(255,255,255,.01));box-shadow:0 8px 30px -12px rgba(255,200,61,.4)}
.choice .key{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;
  font:900 20px var(--display);color:var(--bg);background:var(--blue-soft)}
.choice:hover .key,.choice:focus-visible .key{background:var(--gold)}
.choice .lbl{font-weight:600;font-size:17px;line-height:1.35}
.choice .lbl small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:3px}
.choice .arrow{font:600 18px var(--mono);color:var(--muted);transition:transform .2s}
.choice:hover .arrow{transform:translateX(4px);color:var(--gold)}

.btn{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:999px;font:700 14px var(--display);letter-spacing:.04em;text-transform:uppercase;
  background:var(--gold);color:#1a1400;box-shadow:0 10px 30px -10px rgba(255,200,61,.7);transition:transform .2s,box-shadow .2s
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 16px 40px -10px rgba(255,200,61,.9)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

/* ---------- Intro ---------- */
.intro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 6px}
@media (max-width:700px){.intro-grid{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);border-radius:12px;padding:16px;background:rgba(255,255,255,.02)}
.tile b{display:block;font:700 13px var(--display);margin:8px 0 4px}
.tile p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.tile svg{width:28px;height:28px}

/* ---------- Consequence ---------- */
.verdict{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid}
.verdict.good{color:var(--good);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.verdict.mid{color:var(--warn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.08)}
.verdict.bad{color:var(--bad);border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.08)}
.chosen{font:400 13px var(--mono);color:var(--muted);margin:16px 0 0}
.chosen b{color:var(--text);font-family:var(--sans)}
.effects{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.effect{font:600 13px var(--mono);padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.effect.up{color:var(--good)}.effect.down{color:var(--bad)}
.note{margin:18px 0 0;padding:16px 18px;border-radius:10px;border:1px dashed var(--line-strong);font-size:15px;color:#c6d2ec}
.note b{color:var(--gold);font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px}

/* ---------- Result ---------- */
.result-top{display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:center}
@media (max-width:700px){.result-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.gauge{position:relative;width:240px;height:240px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .val b{font:900 58px/1 var(--display)}
.gauge .val b sup{font-size:24px;vertical-align:top;margin-left:2px}
.gauge .val small{display:block;font:400 11px var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.grade{font:700 13px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.section-t{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px;display:flex;align-items:center;gap:10px}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}
.legal{border-left:3px solid var(--gold);background:rgba(255,200,61,.06);padding:16px 20px;border-radius:0 10px 10px 0;font-size:15.5px}
.final-meters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.final-meters{grid-template-columns:1fr}}
.fm{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:rgba(255,255,255,.02)}
.fm .n{font:900 28px var(--display)}
.fm .l{font-size:13px;color:var(--muted)}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.timeline .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);border:1px solid var(--line-strong)}
.timeline .t{font-weight:600}
.timeline .w{font-size:14px;color:var(--muted);margin-top:4px}
.timeline .pts{font:700 14px var(--mono);white-space:nowrap}
.pts.good{color:var(--good)}.pts.mid{color:var(--warn)}.pts.bad{color:var(--bad)}
.reflect{display:grid;gap:8px;margin:0;padding-left:20px;color:#c6d2ec;font-size:15.5px}

footer{margin-top:34px;text-align:center;font:400 12px var(--mono);color:var(--muted);letter-spacing:.06em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .choice{opacity:1}
}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="radar"></div></div>
<div class="scan"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 3 42 9v14c0 11-7.6 19.4-18 22C13.6 42.4 6 34 6 23V9l18-6Z" fill="#0b1428" stroke="#3d7bff" stroke-width="2"/>
        <path d="M24 12 27 21h9l-7.3 5.3 2.8 8.7L24 29.7 16.5 35l2.8-8.7L12 21h9l3-9Z" fill="#ffc83d"/>
      </svg>
      <div><b>Командирська етика</b><small>симулятор управлінських рішень</small></div>
    </div>
    <div class="status"><span><span class="dot"></span>НАВЧАЛЬНИЙ РЕЖИМ</span><span id="clock"></span></div>
  </header>

  <div class="layout">
    <main class="panel corners stage" id="stage" aria-live="polite"></main>

    <aside class="panel side" aria-label="Показники командира">
      <h3>Показники командира</h3>
      <div id="meters"></div>
      <h3 style="margin-top:22px">Прогрес</h3>
      <div class="progress" id="progress"><span></span><span></span><span></span></div>
      <p class="hint" id="hint">Кожне рішення впливає на законність ваших дій, авторитет і стан колективу.</p>
      <div class="best"><span>Найкращий результат</span><b id="best">—</b></div>
      <div class="best" style="margin-top:6px;border:0;padding-top:0"><span>Спроб</span><b id="tries">0</b></div>
    </aside>
  </div>

  <footer>Навчальний симулятор для здобувачів вищої освіти закладів системи МВС України</footer>
</div>

<script>
/* ================== ICONS ================== */
const ICON = {
  shield:`<svg viewBox="0 0 48 48" fill="none" stroke="#ffc83d" stroke-width="2.2" stroke-linejoin="round"><path d="M24 4 40 10v12c0 10-6.8 17.8-16 20C14.8 39.8 8 32 8 22V10l16-6Z"/><path d="m17 23 5 5 9-10" stroke="#7fa6ff"/></svg>`,
  people:`<svg viewBox="0 0 48 48" fill="none" stroke="#ffc83d" stroke-width="2.2" stroke-linecap="round"><circle cx="17" cy="16" r="6"/><circle cx="33" cy="18" r="5" stroke="#7fa6ff"/><path d="M5 40c1-7 6-11 12-11s11 4 12 11"/><path d="M29 30c6 0 12 3 14 10" stroke="#7fa6ff"/></svg>`,
  clock:`<svg viewBox="0 0 48 48" fill="none" stroke="#ffc83d" stroke-width="2.2" stroke-linecap="round"><circle cx="24" cy="25" r="16"/><path d="M24 15v10l7 5" stroke="#7fa6ff"/><path d="M18 5h12"/></svg>`,
  scale:`<svg viewBox="0 0 48 48" fill="none" stroke="#7fa6ff" stroke-width="2" stroke-linecap="round"><path d="M24 6v36M14 42h20M8 14h32"/><path d="m8 14-5 12h10L8 14Zm32 0-5 12h10l-5-12Z" stroke="#ffc83d"/></svg>`,
  star:`<svg viewBox="0 0 48 48" fill="none" stroke="#7fa6ff" stroke-width="2" stroke-linejoin="round"><path d="m24 5 5.6 12 13 1.4-9.7 8.8 2.8 12.8L24 33.4 12.3 40l2.8-12.8-9.7-8.8 13-1.4L24 5Z" stroke="#ffc83d"/></svg>`,
  chart:`<svg viewBox="0 0 48 48" fill="none" stroke="#7fa6ff" stroke-width="2" stroke-linecap="round"><path d="M6 42h36"/><path d="M12 34V24M22 34V14M32 34V20" stroke="#ffc83d" stroke-width="4"/></svg>`
};

/* ================== DATA ================== */
const METRICS = [
  {id:"law",  name:"Законність дій"},
  {id:"auth", name:"Авторитет командира"},
  {id:"team", name:"Згуртованість колективу"}
];

const SCENES = {
  s1:{
    step:1, icon:"shield", kicker:"Оперативна ситуація №1", title:"Прохання підлеглого",
    text:"Підлеглий, який сумлінно та якісно виконує службові завдання, допустив порушення дисципліни. Він приходить до вас особисто і просить приховати його провину, щоб уникнути дисциплінарного стягнення. Що ви зробите?",
    choices:[
      {key:"А", label:"Діяти за статутом — доповісти командуванню", sub:"Офіційний рапорт без винятків",
        fx:{law:25,auth:10,team:-10}, verdict:"good", pts:45, next:"s2a",
        consequence:"Ви захищені законом, але в колективі можливе тимчасове напруження.",
        why:"Принцип невідворотності відповідальності дотримано."},
      {key:"Б", label:"Кругова порука — приховати провину", sub:"«Свої своїх не здають»",
        fx:{law:-45,auth:-25,team:10}, verdict:"bad", pts:0, ending:"complicity",
        consequence:"Ви берете ризик на себе, отримуєте стягнення та тиск керівництва, стаючи співучасником порушення.",
        why:"Приховування порушення — це співучасть і конфлікт інтересів."},
      {key:"В", label:"Конструктивний компроміс — повідомити, але клопотати про пом'якшення", sub:"Рапорт + клопотання з урахуванням заслуг",
        fx:{law:20,auth:15,team:15}, verdict:"good", pts:50, next:"s2b",
        consequence:"Командування оцінило вашу принциповість, але врахувало щире каяття та сумлінну службу підлеглого.",
        why:"Законна процедура поєднана з індивідуальним підходом."}
    ]
  },
  s2a:{
    step:2, icon:"people", kicker:"Оперативна ситуація №2", title:"Тиск після рапорту",
    text:"Минуло 2 тижні після офіційного рапорту. Колектив підрозділу сприйняв ваш вчинок неоднозначно: частина колег уникає спілкування, вважаючи це «здачею своїх». Водночас вищий керівник викликає вас і каже, що через розголос падають показники морально-психологічного стану підрозділу, і натякає, що на наступну атестацію вам краще не розраховувати. Що ви оберете?",
    choices:[
      {key:"А", label:"Стояти на своєму, ігнорувати тиск", sub:"Дотримуватися закону попри наслідки",
        fx:{law:20,auth:25,team:15}, verdict:"good", pts:55, ending:"iron",
        consequence:"Службова перевірка підтвердила правомірність ваших дій.",
        why:"Ви не піддалися неформальному тиску колективу та керівництва."},
      {key:"Б", label:"Спроба залагодити конфлікт", sub:"Неформальні поступки підлеглим у графіках",
        fx:{law:-25,auth:-30,team:-5}, verdict:"bad", pts:-10, ending:"lostAuthority",
        consequence:"Неформальні поступки створили прецедент вибіркового правосуддя.",
        why:"«Купівля» лояльності руйнує рівність і довіру."}

  },
  s2b:{
    step:2, icon:"clock", kicker:"Оперативна ситуація №2", title:"Повторне порушення",
    text:"Завдяки вашому клопотанню підлеглий отримав м'якше покарання, залишився на службі й подякував. Але через місяць він знову розслабився, спізнився на службу і знову просить «зам'яти» справу, сподіваючись на вашу доброту. Як діятимете далі?",
    choices:[
      {key:"А", label:"Суворе покарання", sub:"Повторне порушення — повна відповідальність",
        fx:{law:20,auth:25,team:5}, verdict:"good", pts:50, ending:"mature",
        consequence:"Ви чітко провели межу згідно зі статутом.",
        why:"Ваша доброта не стала слабкістю."},
      {key:"Б", label:"Черговий компроміс", sub:"Ще раз пробачити «по-людськи»",
        fx:{law:-45,auth:-35,team:-25}, verdict:"bad", pts:-35, ending:"systemic",
        consequence:"Повторне приховування перетворилося на систему.",
        why:"Правила перестали працювати однаково для всіх."},
      {key:"В", label:"Провести виховну бесіду та встановити жорсткий контроль", sub:"Без офіційної фіксації проступку",
        fx:{law:-10,auth:10,team:10}, verdict:"mid", pts:10, ending:"mentor",
        consequence:"Ви уникнули скандалу, але проступок юридично не зафіксовано.",
        why:"Працює локально, але створює персональні ризики для командира."}
    ]
  }
};

const ENDINGS = {
  iron:{title:"Залізна доброчесність", grade:"Найвищий бал", tone:"good",
    text:"Ви не піддалися неформальному тиску колективу та керівництва. Службова перевірка підтвердила правомірність ваших дій, а напруження в підрозділі з часом спало, поступившись повазі до вашої принциповості. Ви зміцнили репутацію непідкупного командира.",
    legal:"Дисциплінарний статут (обов'язок командира підтримувати службову дисципліну) та ст. 22 Закону України «Про запобігання корупції» (недопущення використання службових повноважень в особистих чи корпоративних інтересах)."},
  lostAuthority:{title:"Втрата авторитету", grade:"Низький бал", tone:"bad",
    text:"Намагаючись «купити» лояльність підлеглих неформальними поступками у графіках, ви створили прецедент вибіркового правосуддя. Колектив відчув слабкість, а вище керівництво під час перевірки виявило порушення обліку відпусток, що вдарило по вашій кар'єрі.",
    legal:"Порушення принципу рівності та об'єктивності командира (Статут внутрішньої служби). Компроміс із совістю заради тимчасового спокою руйнує довіру."},
  mature:{title:"Зріле та справедливе лідерство", grade:"Найвищий бал", tone:"good",
    text:"Ви продемонстрували вміння поєднувати людяність із твердістю. Першого разу ви дали підлеглому шанс, але коли він спробував цим зловживати — чітко провели межу згідно зі статутом. Колектив зрозумів, що ваша доброта не є слабкістю.",
    legal:"Дисциплінарний статут (індивідуалізація відповідальності та невідворотність покарання за повторне порушення)."},
  systemic:{title:"Системна помилка та співучасть", grade:"Провал", tone:"bad",
    text:"Повторне приховування порушення перетворилося на систему. Інші працівники побачили, що правила працюють не для всіх, і дисципліна в підрозділі впала. Під час чергової перевірки факти приховування розкрилися, і до відповідальності притягнули вже вас.",
    legal:"Закон України «Про запобігання корупції» (порушення вимог щодо запобігання та врегулювання конфлікту інтересів, приховування правопорушень)."},
  mentor:{title:"Ризиковане наставництво", grade:"Середній бал", tone:"mid",
    text:"Ви уникнули публічного скандалу та взяли ситуацію під ручний контроль. Підлеглий виправився під вашим наглядом, проте юридично факт повторного проступку залишився незафіксованим. Такий підхід спрацював локально, але несе високі персональні ризики для командира у разі перевірки.",
    legal:"Статут внутрішньої служби (обов'язок командира виховувати підлеглих, але в межах визначених законом дисциплінарних процедур)."},
  complicity:{title:"Кругова порука", grade:"Провал", tone:"bad",
    text:"Ви приховали порушення, розраховуючи на вдячність підлеглого. Але факт порушення розкрився, і тепер відповідальність несе не лише він, а й ви — як командир, що свідомо не відреагував. Довіра керівництва втрачена, а колектив засвоїв, що правила можна обходити «по-дружньому».",
    legal:"Дисциплінарний статут (обов'язок командира реагувати на кожне порушення дисципліни) та Закон України «Про запобігання корупції» (неприпустимість приховування правопорушень і дій в умовах конфлікту інтересів)."}
};

const REFLECT = {
  good:["Які аргументи ви наведете колективу, щоб пояснити своє рішення без втрати довіри?","Як підтримувати морально-психологічний стан підрозділу, не поступаючись принципами?"],
  mid:["Що станеться, якщо під час перевірки з'ясується, що повторний проступок не був зафіксований?","Як поєднати виховну роботу з офіційною дисциплінарною процедурою?"],
  bad:["Яку правову відповідальність несе командир за приховування порушень підлеглих?","Чим «кругова порука» загрожує дисципліні та репутації всього підрозділу?","Яке рішення на першому кроці дало б змогу і проявити людяність, і залишитися в межах закону?"]
};

/* ================== STATE ================== */
let state;
const $ = s => document.querySelector(s);
const stage = $("#stage");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(){try{return JSON.parse(localStorage.getItem("cmd-ethics")||"{}")}catch{return {}}},
  set(v){try{localStorage.setItem("cmd-ethics",JSON.stringify(v))}catch{}}
};

function reset(){
  state = {m:{law:50,auth:50,team:50}, history:[], step:0};
  renderMeters();
  setProgress(0);
}

/* ================== HUD ================== */
function color(v){return v>=70?"var(--good)":v>=40?"var(--warn)":"var(--bad)"}
function renderMeters(fx){
  $("#meters").innerHTML = METRICS.map(x=>{
    const v = state.m[x.id], d = fx && fx[x.id];
    return `<div class="meter"><div class="row"><span>${x.name}</span><span>${v}<span class="delta ${d>0?"up":"down"} ${d?"show":""}">${d?(d>0?"+":"")+d:""}</span></span></div>
      <div class="bar"><i style="width:${v}%;background:${color(v)}"></i></div></div>`;
  }).join("");
}
function setProgress(n){
  [...$("#progress").children].forEach((s,i)=>s.classList.toggle("on",i<n));
}
function updateBest(){
  const s = store.get();
  $("#best").textContent = s.best!=null ? s.best+"%" : "—";
  $("#tries").textContent = s.tries||0;
}
setInterval(()=>{$("#clock").textContent=new Date().toLocaleTimeString("uk-UA")},1000);

/* ================== TYPEWRITER ================== */
let typing=null;
function typeText(el,text,done){
  if(reduce){el.textContent=text;done&&done();return}
  let i=0; el.innerHTML='<span></span><span class="caret"></span>';
  const span=el.firstChild;
  typing={finish(){clearInterval(t);span.textContent=text;el.querySelector(".caret")?.remove();typing=null;done&&done()}};
  const t=setInterval(()=>{
    i+=2; span.textContent=text.slice(0,i);
    if(i>=text.length) typing.finish();
  },14);
}

/* ================== SCREENS ================== */
function show(html){
  stage.innerHTML = `<div class="screen">${html}</div>`;
  stage.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
}

function intro(){
  reset();
  $("#hint").textContent="Кожне рішення впливає на законність ваших дій, авторитет і стан колективу.";
  show(`
    <div class="kicker">Навчальний тренажер</div>
    <h1>Ви — <em>командир</em>.<br>Рішення за вами.</h1>
    <p class="lead">Змодельовані службові ситуації, у яких немає простих відповідей. Оберіть, як діяти, — і побачите, як ваші рішення вплинуть на законність, авторитет і колектив. Наприкінці отримаєте оцінку у відсотках і розбір кожного кроку з правовим обґрунтуванням.</p>
    <div class="intro-grid">
      <div class="tile">${ICON.scale}<b>Законність</b><p>Чи відповідають дії вимогам статутів і антикорупційного законодавства.</p></div>
      <div class="tile">${ICON.star}<b>Авторитет</b><p>Як вас сприймають керівництво та підлеглі.</p></div>
      <div class="tile">${ICON.chart}<b>Колектив</b><p>Дисципліна, довіра та морально-психологічний стан підрозділу.</p></div>
    </div>
    <div class="actions"><button class="btn" id="go">Розпочати ▸</button></div>
  `);
  $("#go").onclick=()=>scene("s1");
}

function stepper(cur){
  const names=["Ситуація 1","Ситуація 2","Підсумок"];
  return `<div class="steps" aria-label="Етап ${cur} із 3">`+names.map((n,i)=>{
    const k=i+1, cls=k<cur?"done":k===cur?"now":"";
    return (i?'<span class="sep"></span>':'')+`<span class="st ${cls}"><i>${k<cur?"✓":k}</i>${n}</span>`;
  }).join("")+`</div>`;
}

function scene(id){
  const sc = SCENES[id];
  state.step = sc.step; setProgress(sc.step);
  $("#hint").textContent="Уважно прочитайте ситуацію та оберіть один варіант дій.";
  show(`
    <div class="scene-head">
      <div class="scene-icon">${ICON[sc.icon]}</div>
      <div><div class="kicker">${sc.kicker}</div><h2>${sc.title}</h2>${stepper(sc.step)}</div>
    </div>
    <div class="brief" id="brief"></div>
    <button class="skip" id="skip">Показати весь текст</button>
    <div class="choices" id="choices"></div>
  `);
  const renderChoices=()=>{
    $("#skip")?.remove();
    $("#choices").innerHTML = sc.choices.map((c,i)=>`
      <button class="choice" data-i="${i}" style="animation-delay:${i*0.09}s">
        <span class="key">${c.key}</span>
        <span class="lbl">${c.label}<small>${c.sub}</small></span>
        <span class="arrow">→</span>
      </button>`).join("");
    $("#choices").querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(id,+b.dataset.i));
  };
  typeText($("#brief"),sc.text,renderChoices);
  $("#skip").onclick=()=>typing&&typing.finish();
}

const clamp=v=>Math.max(0,Math.min(100,v));
const VERDICT = {good:"Обґрунтоване рішення",mid:"Ризиковане рішення",bad:"Помилкове рішення"};

function choose(sceneId,i){
  const sc=SCENES[sceneId], c=sc.choices[i];
  for(const k in c.fx) state.m[k]=clamp(state.m[k]+c.fx[k]);
  state.history.push({scene:sc, choice:c});
  renderMeters(c.fx);
  const eff = METRICS.map(x=>{const d=c.fx[x.id]; return `<span class="effect ${d>=0?"up":"down"}">${d>=0?"▲ +":"▼ "}${d} ${x.name}</span>`}).join("");
  const last = !!c.ending;
  $("#hint").textContent = "Зверніть увагу, як змінилися показники командира.";
  show(`
    <div class="kicker">Наслідок рішення</div>
    <p class="chosen">Ваш вибір: <b>${c.key}. ${c.label}</b></p>
    <h2>${c.consequence}</h2>
    <span class="verdict ${c.verdict}">● ${VERDICT[c.verdict]}</span>
    <div class="effects">${eff}</div>
    <div class="note"><b>Чому так</b>${c.why}</div>
    <div class="actions"><button class="btn" id="next">${last?"Підсумки ▸":"Далі ▸"}</button></div>
  `);
  $("#next").onclick=()=> last ? result(c.ending) : scene(c.next);
}

function computeScore(){
  const decisions = state.history.reduce((s,h)=>s+h.choice.pts,0);   // up to 100
  const avg = (state.m.law+state.m.auth+state.m.team)/3;               // 0..100
  // 75% — якість рішень, 25% — підсумкові показники
  return Math.round(clamp(clamp(decisions)*0.75 + avg*0.25));
}

function result(endingId){
  const e = ENDINGS[endingId];
  const score = computeScore();
  setProgress(3);
  const s = store.get(); s.tries=(s.tries||0)+1; s.best=Math.max(s.best??0,score); store.set(s); updateBest();
  $("#hint").textContent = "Перегляньте розбір і спробуйте інший шлях — порівняйте результати.";
  const tone = score>=80?"good":score>=50?"mid":"bad";
  const col = {good:"#3ddc97",mid:"#ffb547",bad:"#ff5d6c"}[tone];
  const C = 2*Math.PI*104;
  const message = score>=80 ? "Відмінно! Ви дієте як зразковий командир: законно, послідовно та справедливо."
                : score>=50 ? "Непогано, але є ризики. Подумайте, як діяти в межах закону без шкоди для людей."
                : "Рішення суперечать вимогам закону та статутів. Пройдіть симулятор ще раз і порівняйте наслідки.";
  show(`
    <div class="result-top">
      <div class="gauge">
        <svg viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="104" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16"/>
          <circle cx="120" cy="120" r="104" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1" stroke-dasharray="2 8" transform="scale(.82) translate(26 26)"/>
          <circle id="arc" cx="120" cy="120" r="104" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 12px ${col})"/>
        </svg>
        <div class="val"><div><b><span id="num">0</span><sup>%</sup></b><small>етичний рейтинг</small></div></div>
      </div>
      <div>
        <div style="margin-bottom:14px">${stepper(3)}</div><div class="kicker">Підсумок · ${e.grade}</div>
        <h1 style="font-size:clamp(28px,4vw,44px)">${e.title}</h1>
        <p class="grade" style="color:${col}">${message}</p>
      </div>
    </div>

    <div class="section-t">Наслідки</div>
    <p style="margin:0">${e.text}</p>

    <div class="section-t">Правова основа</div>
    <div class="legal">${e.legal}</div>

    <div class="section-t">Підсумкові показники</div>
    <div class="final-meters">
      ${METRICS.map(x=>`<div class="fm"><div class="n" style="color:${color(state.m[x.id])}">${state.m[x.id]}%</div><div class="l">${x.name}</div>
        <div class="bar" style="margin-top:10px"><i style="width:${state.m[x.id]}%;background:${color(state.m[x.id])}"></i></div></div>`).join("")}
    </div>

    <div class="section-t">Розбір ваших рішень</div>
    <ol class="timeline">
      ${state.history.map((h,i)=>`<li>
        <span class="num">${i+1}</span>
        <div><div class="t">${h.scene.title}: ${h.choice.key}. ${h.choice.label}</div><div class="w">${VERDICT[h.choice.verdict]} — ${h.choice.why}</div></div>
        <span class="pts ${h.choice.verdict}">${h.choice.verdict==="good"?"✔":h.choice.verdict==="mid"?"!":"✖"}</span>
      </li>`).join("")}
    </ol>

    <div class="section-t">Питання для обговорення</div>
    <ul class="reflect">${REFLECT[tone].map(q=>`<li>${q}</li>`).join("")}</ul>

    <div class="actions">
      <button class="btn" id="again">↻ Пройти ще раз</button>
      <button class="btn ghost" id="copy">Скопіювати результат</button>
    </div>
  `);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("#arc").style.strokeDashoffset = C*(1-score/100); }));
  const num=$("#num"), t0=performance.now(), dur=reduce?0:1800;
  (function tick(t){const p=dur?Math.min(1,(t-t0)/dur):1; num.textContent=Math.round(score*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(tick)})(t0);
  $("#again").onclick=intro;
  $("#copy").onclick=async()=>{
    const txt=`Командирська етика — мій результат: ${score}% («${e.title}»). `+
      state.history.map((h,i)=>`Крок ${i+1}: ${h.choice.label}`).join("; ")+".";
    try{await navigator.clipboard.writeText(txt);$("#copy").textContent="Скопійовано ✔"}catch{$("#copy").textContent="Не вдалося скопіювати"}
  };
}

/* ================== START ================== */
updateBest();
intro();
document.addEventListener("keydown",e=>{
  const map={"1":0,"2":1,"3":2,"а":0,"б":1,"в":2,"a":0,"b":1,"v":2};
  const btns=[...document.querySelectorAll(".choice")];
  if(btns.length && map[e.key.toLowerCase()]!=null && btns[map[e.key.toLowerCase()]]) btns[map[e.key.toLowerCase()]].click();
  else if(e.key==="Enter" && typing) typing.finish();
});
</script>
